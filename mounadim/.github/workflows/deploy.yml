name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: mounadim/package-lock.json}
      - run: npm install
        working-directory: mounadim
      - run: npm run build
        working-directory: mounadim
      - uses: actions/upload-pages-artifact@v3
        with: {path: mounadim/dist}
      - id: deployment
        uses: actions/deploy-pages@v4
